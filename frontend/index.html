<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adaptive Study Planner — Phase 3</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.44.0/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0f172a;--surface:#1e293b;--accent:#06b6d4;--text:#f8fafc;--muted:#94a3b8;--danger:#ef4444;--success:#22c55e;--warning:#f59e0b;}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:20px;line-height:1.5}
.container{max-width:900px;margin:auto}
header{text-align:center;margin-bottom:24px}
header h1{margin:0;font-size:28px;letter-spacing:-0.5px}
header p{color:var(--muted);margin:4px 0 0}
.card{background:var(--surface);border-radius:12px;padding:20px;margin-bottom:16px;border:1px solid #334155}
.card h2{margin:0 0 12px;font-size:18px}
label{display:block;margin:8px 0 4px;color:var(--muted);font-size:13px}
input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:var(--text);font-size:14px}
input[type=range]{padding:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:8px;border:none;font-size:14px;cursor:pointer;background:var(--accent);color:#000;font-weight:600}
.btn:hover{opacity:.92}
.btn.secondary{background:#334155;color:var(--text)}
.status{font-size:13px;margin-top:8px;min-height:20px}
.status.ok{color:var(--success)}
.status.err{color:var(--danger)}
.plan-item{padding:12px;border-radius:8px;background:#0f172a;margin-bottom:8px;border-left:4px solid var(--accent)}
.plan-item.focus{border-left-color:var(--warning)}
.plan-item .name{font-weight:700}
.plan-item .meta{font-size:13px;color:var(--muted)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;background:#334155}
.pill.High{background:var(--danger);color:#fff}
.pill.Medium{background:var(--warning);color:#000}
.pill.Low{background:var(--success);color:#000}
#metrics{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.metric{flex:1;min-width:120px;background:var(--surface);padding:14px;border-radius:10px;text-align:center;border:1px solid #334155}
.metric .value{font-size:22px;font-weight:800}
.metric .label{font-size:12px;color:var(--muted);margin-top:4px}
pre{background:#0f172a;padding:10px;border-radius:8px;overflow:auto;font-size:12px}
#auth-section{display:none}
#main-section{display:none}
#user-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding:12px;background:var(--surface);border-radius:8px}
#user-bar .email{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="container">
<header>
<h1>Adaptive Study Planner</h1>
<p>Phase 3 — Multi-User Platform</p>
</header>

<div id="auth-section" class="card">
<h2>Authentication</h2>
<div class="row">
<div><label>Email</label><input id="auth-email" type="email" placeholder="you@example.com"></div>
<div><label>Password</label><input id="auth-password" type="password" placeholder="••••••••"></div>
</div>
<button class="btn" onclick="signIn()" style="margin-top:10px">Sign In</button>
<button class="btn secondary" onclick="signUp()" style="margin-top:10px">Sign Up</button>
<div id="s-auth" class="status"></div>
</div>

<div id="main-section">
<div id="user-bar">
<div class="email" id="user-email">Not logged in</div>
<button class="btn secondary" onclick="signOut()">Sign Out</button>
</div>

<div id="metrics">
<div class="metric"><div class="value" id="m-readiness">—</div><div class="label">Readiness</div></div>
<div class="metric"><div class="value" id="m-topics">—</div><div class="label">Topics</div></div>
<div class="metric"><div class="value" id="m-day">—</div><div class="label">Day</div></div>
</div>

<div class="card">
<h2>Add Topic</h2>
<div class="row">
<div><label>Subject</label><input id="in-subject" placeholder="Mathematics" value="Mathematics"></div>
<div><label>Topic Name</label><input id="in-name" placeholder="Calculus"></div>
</div>
<div class="row">
<div><label>Difficulty (D) <span id="v-d">0.5</span></label><input id="in-d" type="range" min="0" max="1" step="0.05" value="0.5" oninput="document.getElementById('v-d').textContent=this.value"></div>
<div><label>Past Paper Freq (P) <span id="v-p">0.5</span></label><input id="in-p" type="range" min="0" max="0.9" step="0.05" value="0.5" oninput="document.getElementById('v-p').textContent=this.value"></div>
</div>
<div class="row">
<div><label>User Performance (U) <span id="v-u">0.5</span></label><input id="in-u" type="range" min="0" max="1" step="0.05" value="0.5" oninput="document.getElementById('v-u').textContent=this.value"></div>
<div style="display:flex;align-items:flex-end"><button class="btn" onclick="addTopic()">Add Topic</button></div>
</div>
<div id="s-add" class="status"></div>
</div>

<div class="card">
<h2>Log Session</h2>
<div class="row">
<div><label>Topic</label><select id="sel-topic"><option value="">Select topic</option></select></div>
<div style="display:flex;align-items:flex-end;gap:8px">
<label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="chk-studied" checked> Studied today</label>
<label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="chk-mistake"> Made mistake</label>
</div>
</div>
<button class="btn" style="margin-top:10px" onclick="logSession()">Log Session</button>
<div id="s-log" class="status"></div>
</div>

<div class="card">
<h2>Study Plan</h2>
<button class="btn" onclick="generatePlan()">Generate Plan</button>
<button class="btn secondary" onclick="advanceDay()">Simulate Next Day</button>
<div id="plan-out" style="margin-top:12px"></div>
<div id="s-plan" class="status"></div>
</div>

<div class="card">
<h2>Raw State</h2>
<pre id="state-pre">Loading...</pre>
</div>
</div>
</div>

<script src="phase3-app.js"></script>
</body>
</html>
