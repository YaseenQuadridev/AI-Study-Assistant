name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"  # Nightly at 2 AM

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install flake8 black isort bandit safety
      - run: flake8 backend/ --max-line-length=120 --exclude=__pycache__
      - run: black --check backend/ --line-length=120
      - run: isort --check-only backend/
      - run: npm install -g eslint
      - run: eslint frontend/ --ext .js || true

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest pytest-cov
      - run: pip install -r requirements.txt || true
      - run: pytest tests/ --cov=backend --cov-report=xml --cov-report=term -v
      - uses: codecov/codecov-action@v4
        with: { files: ./coverage.xml, fail_ci_if_error: false }

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: ankane/pgvector:latest
        env: { POSTGRES_PASSWORD: postgres }
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest requests
      - run: pip install -r requirements.txt || true
      - run: pytest tests/ -k integration -v || true

  security-scan:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install bandit safety
      - run: bandit -r backend/ -f json -o bandit-report.json || true
      - run: safety check --json -o safety-report.json || true
      - uses: actions/upload-artifact@v4
        with: { name: security-reports, path: "*-report.json" }

  performance-tests:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g k6
      - run: k6 run --vus 200 --duration 30s tests/performance/load_test.js || true

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, security-scan]
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with: { apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}, command: deploy --env staging }

  deploy-production:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, security-scan, performance-tests]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with: { apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}, command: deploy --env production }
      - run: echo "Deployed to production!"
